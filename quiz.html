<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e3c72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>國家任務 - 知識問答溫習</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      color: #333;
    }

    /* 手機容器 */
    .app-container {
      width: 100%;
      max-width: 460px;
      height: 92dvh;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 頂部標頭 */
    .header {
      background: #c0392b;
      color: white;
      padding: 16px 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .header p {
      font-size: 0.8rem;
      opacity: 0.9;
      margin-top: 3px;
    }

    /* 主要內容區 */
    .content {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
    }

    /* 模式選擇畫面 */
    .menu-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      height: 100%;
      text-align: center;
    }

    .menu-title {
      font-size: 1.2rem;
      color: #2c3e50;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: #27ae60;
      color: white;
    }

    .btn-secondary {
      background: #2980b9;
      color: white;
    }

    .btn-next {
      background: #e67e22;
      color: white;
      margin-top: 15px;
      display: none;
    }

    /* 答題畫面 */
    .quiz-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #27ae60;
      transition: width 0.25s ease;
    }

    .quiz-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 14px;
      font-weight: 700;
    }

    .question-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.5;
      color: #1e293b;
      min-height: 90px;
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      padding: 14px 16px;
      text-align: left;
      border: 2px solid #e2e8f0;
      background: #ffffff;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.4;
      cursor: pointer;
      color: #333;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .option-btn.correct {
      background: #d4edda !important;
      border-color: #28a745 !important;
      color: #155724 !important;
      font-weight: bold;
    }

    .option-btn.wrong {
      background: #f8d7da !important;
      border-color: #dc3545 !important;
      color: #721c24 !important;
    }

    .feedback-msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
      line-height: 1.4;
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
    }

    /* 結算畫面 */
    .result-screen {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      gap: 20px;
    }

    .score-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
    }

    .score-number {
      font-size: 3rem;
      font-weight: 800;
      color: #2c3e50;
      margin: 8px 0;
    }

    .result-details {
      font-size: 0.95rem;
      color: #475569;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>國家任務 題目溫習</h1>
    <p>知識問答與溫習測試</p>
  </div>

  <div class="content">
    <!-- 主選單 -->
    <div id="menu-screen" class="menu-screen">
      <div class="menu-title">請選擇測驗模式</div>
      <button class="btn btn-primary" onclick="startGame(1)">模式 1：隨機 20 題</button>
      <button class="btn btn-secondary" onclick="startGame(2)">模式 2：全題庫測驗</button>
    </div>

    <!-- 答題畫面 -->
    <div id="quiz-screen" class="quiz-screen">
      <div>
        <div class="progress-bar-bg">
          <div id="progress-bar" class="progress-bar-fill"></div>
        </div>

        <div class="quiz-info">
          <span id="question-count">第 1 題</span>
          <span id="score-count">得分：0</span>
        </div>

        <div id="question-text" class="question-card">載入中...</div>

        <div id="options-container" class="options-container"></div>

        <div id="feedback-msg" class="feedback-msg"></div>
      </div>

      <button id="next-btn" class="btn btn-next" onclick="nextQuestion()">下一題 ➔</button>
    </div>

    <!-- 結算畫面 -->
    <div id="result-screen" class="result-screen">
      <h2 style="color: #2c3e50; font-size: 1.4rem;">測驗完成</h2>
      
      <div class="score-box">
        <div style="font-size:0.85rem; color:#64748b; font-weight:bold;">總得分</div>
        <div id="final-score" class="score-number">0</div>
        <div class="result-details" id="result-details"></div>
      </div>

      <button class="btn btn-primary" onclick="showMenu()">返回主選單</button>
    </div>
  </div>
</div>

<script>

  let currentQuestions = [];
  let currentIndex = 0;
  let score = 0;
  let canAnswer = true;

  function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startGame(mode) {
    score = 0;
    currentIndex = 0;
    canAnswer = true;

    let pool = shuffle(rawQuestions);
    currentQuestions = (mode === 1) ? pool.slice(0, 20) : pool;

    document.getElementById("menu-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "flex";

    loadQuestion();
  }

  function loadQuestion() {
    canAnswer = true;
    document.getElementById("next-btn").style.display = "none";
    document.getElementById("feedback-msg").style.display = "none";

    let qData = currentQuestions[currentIndex];
    let total = currentQuestions.length;
    let progress = (currentIndex / total) * 100;

    document.getElementById("progress-bar").style.width = progress + "%";
    document.getElementById("question-count").innerText = `第 ${currentIndex + 1} / ${total} 題`;
    document.getElementById("score-count").innerText = `得分：${score}`;
    document.getElementById("question-text").innerText = `${currentIndex + 1}. ${qData.q}`;

    let shuffledOptions = shuffle(qData.options);
    let container = document.getElementById("options-container");
    container.innerHTML = "";

    const labels = ["A", "B", "C", "D"];
    shuffledOptions.forEach((optText, idx) => {
      let btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = `<strong>${labels[idx]}.</strong> <span>${optText}</span>`;
      btn.onclick = () => checkAnswer(btn, optText, qData.a);
      container.appendChild(btn);
    });
  }

  function checkAnswer(selectedBtn, selectedText, correctText) {
    if (!canAnswer) return;
    canAnswer = false;

    let allBtns = document.querySelectorAll(".option-btn");

    if (selectedText === correctText) {
      selectedBtn.classList.add("correct");
      score += 5; // 每題固定 5 分
      document.getElementById("score-count").innerText = `得分：${score}`;
      
      setTimeout(() => {
        nextQuestion();
      }, 600);
    } else {
      selectedBtn.classList.add("wrong");
      allBtns.forEach(btn => {
        if (btn.innerText.includes(correctText)) {
          btn.classList.add("correct");
        }
      });

      let feedback = document.getElementById("feedback-msg");
      feedback.innerText = `❌ 回答錯誤！正確答案是：\n${correctText}`;
      feedback.style.display = "block";
      document.getElementById("next-btn").style.display = "block";
    }
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
      loadQuestion();
    } else {
      endGame();
    }
  }

  function endGame() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "flex";

    let total = currentQuestions.length;
    let correctCount = score / 5;
    let accuracy = Math.round((correctCount / total) * 100);

    document.getElementById("final-score").innerText = score;
    
    let evalText = "";
    if (accuracy === 100) evalText = "全對滿分，概念非常扎實！";
    else if (accuracy >= 80) evalText = "表現優秀，大部分題目皆已掌握！";
    else if (accuracy >= 60) evalText = "順利合格，建議針對錯題加強溫習。";
    else evalText = "建議重新閱讀資料，多加練習！";

    document.getElementById("result-details").innerHTML = `
      答對題數：<strong>${correctCount} / ${total}</strong> 題<br>
      正確率：<strong>${accuracy}%</strong><br><br>
      ${evalText}
    `;
  }

  function showMenu() {
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("menu-screen").style.display = "flex";
  }
